name: .NET build and tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - run: dotnet restore TechSupportRagBot.sln
      - run: dotnet test TechSupportRagBot.sln --configuration Release --no-restore
